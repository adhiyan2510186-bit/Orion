[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["backend/.venv", "backend/app/schemas/argo.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is the framework idiom
    "RUF012",  # ClassVar annotations on Pydantic model config
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff.lint.isort]
known-first-party = ["app", "contracts"]
